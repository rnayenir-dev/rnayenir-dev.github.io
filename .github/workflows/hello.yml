name: Olá mundo real # nome da action

# gatilho, quando aa action vai rodar
on:
  push:
    branches: ['main']

# Cria as tarefas que devem ser executadas
jobs:
  saudacao: # nome da tarefa
    runs-on: ubuntu-latest # onde deve ser executado
    steps: # etapas
      - name: Primeiro contato
        run: echo "Olá mundo real"
      - name: Resposta
        run: echo "A exito esta chegando"
