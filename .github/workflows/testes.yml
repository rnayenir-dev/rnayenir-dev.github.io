name: Testes automatizados

on:
  pull_request:
    type: [opened, synchronize, reopened]

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --ci